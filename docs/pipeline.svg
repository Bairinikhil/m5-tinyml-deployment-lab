<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">M5 TinyML motion classifier pipeline</title>
  <desc id="desc">A four-stage pipeline from M5CoreS3 IMU data capture to laptop training, tiny decision-tree export, and live embedded inference.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#12243a"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1"><stop stop-color="#142b42"/><stop offset="1" stop-color="#1b3853"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#69e6c1"/></marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <text x="60" y="70" fill="#69e6c1" font-family="Arial,sans-serif" font-size="30" font-weight="700">M5 TinyML Motion Classifier</text>
  <text x="60" y="103" fill="#a9c2d8" font-family="Arial,sans-serif" font-size="17">From raw IMU samples to offline predictions on the device</text>
  <g filter="url(#shadow)" font-family="Arial,sans-serif">
    <rect x="60" y="165" width="235" height="245" rx="18" fill="url(#card)" stroke="#315878"/>
    <rect x="335" y="165" width="235" height="245" rx="18" fill="url(#card)" stroke="#315878"/>
    <rect x="610" y="165" width="235" height="245" rx="18" fill="url(#card)" stroke="#315878"/>
    <rect x="885" y="165" width="255" height="245" rx="18" fill="url(#card)" stroke="#315878"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#fff">
    <text x="85" y="210" fill="#69e6c1" font-size="19" font-weight="700">1 · CAPTURE</text>
    <text x="85" y="250" font-size="17">M5CoreS3 IMU</text><text x="85" y="278" fill="#b6cde0" font-size="15">50 Hz over USB</text>
    <text x="85" y="325" font-size="15">Labeled trials</text><text x="85" y="351" font-size="15">Quality reports</text><text x="85" y="377" font-size="15">No cloud or audio</text>
    <text x="360" y="210" fill="#69e6c1" font-size="19" font-weight="700">2 · TRAIN</text>
    <text x="360" y="250" font-size="17">Clean CSV rows</text><text x="360" y="278" fill="#b6cde0" font-size="15">1 s windows</text>
    <text x="360" y="325" font-size="15">48 interpretable features</text><text x="360" y="351" font-size="15">Held-out trials</text><text x="360" y="377" font-size="15">Confusion matrix</text>
    <text x="635" y="210" fill="#69e6c1" font-size="19" font-weight="700">3 · EXPORT</text>
    <text x="635" y="250" font-size="17">Tiny decision tree</text><text x="635" y="278" fill="#b6cde0" font-size="15">3 internal nodes</text>
    <text x="635" y="325" font-size="15">Generated C++ header</text><text x="635" y="351" font-size="15">No ML runtime</text><text x="635" y="377" font-size="15">Same features</text>
    <text x="910" y="210" fill="#69e6c1" font-size="19" font-weight="700">4 · INFER</text>
    <text x="910" y="250" font-size="17">M5CoreS3 offline</text><text x="910" y="278" fill="#b6cde0" font-size="15">50 Hz acquisition</text>
    <text x="910" y="325" font-size="15">STILL</text><text x="910" y="351" font-size="15">SHAKING</text><text x="910" y="377" font-size="15">ROTATING</text>
  </g>
  <g stroke="#69e6c1" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M300 287 H325"/><path d="M575 287 H600"/><path d="M850 287 H875"/></g>
  <rect x="60" y="465" width="1080" height="42" rx="21" fill="#0c1d30" stroke="#284862"/>
  <text x="600" y="492" text-anchor="middle" fill="#b6cde0" font-family="Arial,sans-serif" font-size="16">Measured on device: 5–6 µs inference · 0 stream drops · 521,987 bytes flash</text>
</svg>
